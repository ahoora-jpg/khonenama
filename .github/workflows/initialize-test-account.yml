name: Initialize legacy test account
on:
  workflow_dispatch:
    inputs:
      phone:
        description: Owner-authorized test account phone
        required: true
        type: string
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/initialize-legacy-test-account.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEST_BUSINESS_PASSWORD: ${{ secrets.TEST_BUSINESS_PASSWORD }}
          TEST_BUSINESS_PHONE: ${{ inputs.phone }}
