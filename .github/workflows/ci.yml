name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: khonenama-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: node --test tools/test-build-glob.mjs
      - name: Payment activation and callback security
        run: node --test tools/test-billing.mjs
      - name: Booth publication and discovery
        run: node --test tools/test-business-sitemap.mjs tools/test-commercial-readiness.mjs tools/test-admin-business-lifecycle.mjs
      - run: npm run check:vinext
      - run: npm run build:vinext
