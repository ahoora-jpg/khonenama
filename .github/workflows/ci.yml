name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: khonenama-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan reachable history and working tree for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - name: Authentication, upload and browser security regression
        run: node --test tools/test-auth-hardening.mjs tools/test-security-hardening.mjs tools/test-password-recovery.mjs tools/test-request-security.mjs tools/test-business-upload.mjs tools/test-image-upload-processing.mjs tools/test-gallery-security.mjs tools/test-r2-media.mjs
      - name: SMS center mock gateway and migration tests
        run: node --experimental-strip-types --test tools/test-sms-center.mjs tools/test-sms-admin.mjs tools/test-sms-ui.mjs tools/test-sms-acquisition.mjs tools/test-sms-durable-events.mjs tools/test-sms-isolation.mjs tools/test-sms-command-center.mjs
      - run: node --test tools/test-build-glob.mjs
      - run: node --test tools/test-image-recovery.mjs
      - name: Seller acquisition aggregate event boundaries
        run: node --test tools/test-seller-acquisition.mjs
      - name: Payment activation and callback security
        run: node --test tools/test-billing.mjs
      - name: Customer safeguards and private support
        run: node --test tools/test-customer-safeguards.mjs tools/test-marketplace-workflows.mjs tools/test-admin-offers.mjs
      - name: Booth publication and discovery
        run: node --test tools/test-service-discovery.mjs tools/test-business-sitemap.mjs tools/test-commercial-readiness.mjs tools/test-admin-business-lifecycle.mjs
      - run: npm run check:vinext
      - run: npm run build:vinext
