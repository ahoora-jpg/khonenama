name: Full live owner and mobile audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Real production flows (fictional test account only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9bbb17f959c166a9e2b73c9a087c0beb
          AUDIT_EMAIL: arya.master1981@gmail.com
        run: node tools/full-live-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-audit-results
          path: outputs/full-live-audit.json
          retention-days: 7
