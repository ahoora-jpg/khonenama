name: Deploy Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: khonenama-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9bbb17f959c166a9e2b73c9a087c0beb

        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing Cloudflare account ID" && exit 1)
      - run: npm ci
      - run: node --experimental-strip-types --test tools/test-sms-center.mjs tools/test-sms-admin.mjs tools/test-sms-ui.mjs tools/test-sms-acquisition.mjs tools/test-sms-durable-events.mjs tools/test-sms-isolation.mjs
      - run: node --test tools/test-image-recovery.mjs
      - run: node --test tools/test-custom-capacity.mjs tools/test-media-retention.mjs
      - run: node --test tools/test-owner-slug-limit.mjs tools/test-model-quotes.mjs
      - run: node --test tools/test-password-recovery.mjs tools/test-profile-reminders.mjs tools/test-business-installments.mjs
      - run: node --test tools/test-service-search.mjs tools/test-quote-metrics.mjs tools/test-notification-test.mjs
      - run: node --test tools/test-video-plans.mjs tools/test-conversion-flow.mjs tools/test-business-push.mjs tools/test-business-web-push.mjs tools/test-service-discovery.mjs tools/test-customer-form-readability.mjs
      - run: node --test tools/test-customer-safeguards.mjs tools/test-billing.mjs tools/test-subscription-lifecycle.mjs tools/test-gallery-security.mjs tools/test-commercial-readiness.mjs tools/test-admin-offers.mjs tools/test-image-upload-processing.mjs tools/test-r2-media.mjs tools/test-business-upload.mjs tools/test-admin-business-lifecycle.mjs tools/test-build-glob.mjs tools/test-marketplace-workflows.mjs tools/test-request-security.mjs
      - run: node --test tools/test-business-promotion.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9bbb17f959c166a9e2b73c9a087c0beb

      - name: Deploy isolated SMS worker
        run: node tools/prepare-sms-deploy.mjs && npx wrangler deploy --config dist/server/wrangler.sms.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9bbb17f959c166a9e2b73c9a087c0beb
      - run: node tools/check-production-core.mjs
