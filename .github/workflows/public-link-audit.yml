name: Audit public links and uploaded assets
on:
  workflow_dispatch:
    inputs:
      paths_json:
        description: Optional JSON array of internal paths to recheck
        type: string
        default: "[]"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/audit-public-links.mjs
        env:
          AUDIT_PATHS_JSON: ${{ inputs.paths_json }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-link-audit
          path: |
            outputs/public-link-audit.json
            outputs/public-content-audit.json
          retention-days: 7
