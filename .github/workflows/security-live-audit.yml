name: Read-only live security checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/audit-security-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-live-audit
          path: outputs/security-live-20261017.json
          retention-days: 14
